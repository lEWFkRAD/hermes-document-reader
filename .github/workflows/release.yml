name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  service-locks:
    name: Hashed Windows service runtime / Python ${{ matrix.python-version }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            install/locks/windows-cpython-311-x86_64.txt
            install/locks/windows-cpython-314-x86_64.txt
            scripts/lock-inputs/service-bootstrap.txt
      - name: Install, verify, and audit the declared service lane
        shell: pwsh
        run: |
          $pythonMinor = "${{ matrix.python-version }}"
          $minor = $pythonMinor.Replace(".", "")
          $lock = "install/locks/windows-cpython-$minor-x86_64.txt"
          $serviceRoot = Join-Path $env:RUNNER_TEMP "document-reader-service-$minor"
          $servicePython = Join-Path $serviceRoot "Scripts/python.exe"
          $report = Join-Path $env:RUNNER_TEMP "document-reader-service-$minor-pip-report.json"
          node scripts/validate-service-locks.mjs
          python -m venv $serviceRoot
          & $servicePython -I -m pip install --disable-pip-version-check --upgrade --force-reinstall --require-hashes --only-binary=:all: --report $report --requirement $lock
          if ($LASTEXITCODE -ne 0) { throw "Hashed service-lock install failed" }
          & $servicePython -I scripts/verify_service_lock_install.py --lock $lock --report $report --python-minor $pythonMinor
          if ($LASTEXITCODE -ne 0) { throw "Service lock report/inventory verification failed" }
          & $servicePython -I -m pip check
          & $servicePython -I -c "import bs4, chandra, filetype, httpx, openai, openpyxl, pypdfium2"
          python -m pip install --disable-pip-version-check --upgrade pip==26.1.2
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement $lock --no-deps
      - name: Exercise real lifecycle provision, reuse, and tamper gates
        shell: pwsh
        run: >-
          python scripts/verify-lifecycle-provisioning.py
          --source-root "$PWD"
          --temporary-parent "$env:RUNNER_TEMP"

  release:
    name: Validate, attest, and publish
    needs: [service-locks]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            install/locks/windows-cpython-311-x86_64.txt
            install/locks/windows-cpython-314-x86_64.txt
            scripts/lock-inputs/service-bootstrap.txt
      - name: Require tagged commit on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main" }
          node scripts/verify-release-ancestry.mjs --tag "${{ github.ref_name }}" --main-ref refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag is not reachable from main" }
          node scripts/verify-release-tag.mjs --tag "${{ github.ref_name }}" --event-sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Release tag identity validation failed" }
      - run: npm ci --ignore-scripts
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.1.2
      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
      - run: npm run validate
      - run: python -m pytest tests -q --basetemp "${{ runner.temp }}/document-reader-tests"
      - run: >-
          python -m compileall -q
          __init__.py cli.py dashboard engine engine_config.py install lifecycle.py mcp
          profile_runtime.py service tests viewer
      - run: npm audit --omit=dev --audit-level=high
      - run: python -m pip_audit --requirement install/locks/windows-cpython-311-x86_64.txt --no-deps
      - run: python -m pip_audit --requirement install/locks/windows-cpython-314-x86_64.txt --no-deps
      - run: python -m pip_audit --requirement requirements.txt
      - run: python -m pip_audit --requirement requirements-dev.txt
      - name: Audit the fully resolved release environment (no vulnerability ignores)
        run: python -m pip_audit --local
      - name: Verify tag and version sources
        id: metadata
        shell: pwsh
        run: |
          $version = (& node scripts/verify-release-metadata.mjs --tag "${{ github.ref_name }}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release metadata validation failed" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and smoke-test release archives
        shell: pwsh
        run: |
          node scripts/build-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact build failed" }
          node scripts/smoke-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact smoke test failed" }
      - name: Validate whole-product archive without Git metadata
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $archive = Join-Path $PWD "dist/hermes-document-reader-source-v$version.zip"
          $smoke = Join-Path $env:RUNNER_TEMP "document-reader-release-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $smoke
          Push-Location (Join-Path $smoke "hermes-document-reader-source-v$version")
          try {
            if (Test-Path -LiteralPath .git) { throw "Release archive unexpectedly contains Git metadata" }
            npm ci --ignore-scripts
            npm run validate
            python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
            python -m pytest tests -q --basetemp "$env:RUNNER_TEMP/document-reader-source-tests"
            python -m compileall -q __init__.py cli.py dashboard engine engine_config.py install lifecycle.py mcp profile_runtime.py service tests viewer
          } finally {
            Pop-Location
          }
      - name: Import-smoke the installable plugin archive
        shell: pwsh
        run: >-
          python scripts/smoke_plugin_archive.py
          "dist/hermes-document-reader-v${{ steps.metadata.outputs.version }}.zip"
          --version "${{ steps.metadata.outputs.version }}"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.zip
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-release-tag.mjs --tag "${{ github.ref_name }}" --event-sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Remote release tag changed during the workflow" }
          $version = "${{ steps.metadata.outputs.version }}"
          $expected = @(
            "hermes-document-reader-source-v$version.zip"
            "hermes-document-reader-source-v$version.zip.sha256"
            "hermes-document-reader-v$version.zip"
            "hermes-document-reader-v$version.zip.sha256"
          )
          $assets = @(Get-ChildItem -LiteralPath dist -File | Sort-Object Name)
          $actual = @($assets | ForEach-Object Name)
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($assets.Count -ne 4 -or $difference) {
            throw "Expected two ZIPs and two checksum files with exact release names"
          }
          $assetPaths = @($assets.FullName)
          gh release create "${{ github.ref_name }}" @assetPaths --verify-tag --title "Hermes Document Reader ${{ github.ref_name }}" --notes-from-tag
