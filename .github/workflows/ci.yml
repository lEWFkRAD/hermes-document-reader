name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Contributor pull requests execute untrusted code. Keep the token read-only,
# remove persisted checkout credentials, and never use pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            install/locks/windows-cpython-311-x86_64.txt
            install/locks/windows-cpython-314-x86_64.txt
            scripts/lock-inputs/service-bootstrap.txt
      - name: Install and verify the hashed Windows service runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonMinor = "${{ matrix.python-version }}"
          $minor = $pythonMinor.Replace(".", "")
          $machine = (& python -c "import platform; print(platform.machine().lower())").Trim()
          if ($minor -notin @("311", "314")) { throw "Unsupported service-lock Python lane: $minor" }
          if ($machine -notin @("amd64", "x86_64")) { throw "Unsupported service-lock machine: $machine" }
          $lock = "install/locks/windows-cpython-$minor-x86_64.txt"
          $serviceRoot = Join-Path $env:RUNNER_TEMP "document-reader-service-$minor"
          $servicePython = Join-Path $serviceRoot "Scripts/python.exe"
          $report = Join-Path $env:RUNNER_TEMP "document-reader-service-$minor-pip-report.json"
          node scripts/validate-service-locks.mjs
          python -m venv $serviceRoot
          & $servicePython -I -m pip install --disable-pip-version-check --upgrade --force-reinstall --require-hashes --only-binary=:all: --report $report --requirement $lock
          if ($LASTEXITCODE -ne 0) { throw "Hashed service-lock install failed" }
          & $servicePython -I scripts/verify_service_lock_install.py --lock $lock --report $report --python-minor $pythonMinor
          if ($LASTEXITCODE -ne 0) { throw "Service lock report/inventory verification failed" }
          & $servicePython -I -m pip check
          & $servicePython -I -c "import bs4, chandra, filetype, httpx, openai, openpyxl, pypdfium2"
      - name: Exercise real lifecycle provision, reuse, and tamper gates
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/verify-lifecycle-provisioning.py
          --source-root "$PWD"
          --temporary-parent "$env:RUNNER_TEMP"
      - name: Bootstrap exact CI pip
        run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
      - name: Audit the selected hashed Windows service lock
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $minor = (& python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')").Trim()
          python -m pip_audit --requirement "install/locks/windows-cpython-$minor-x86_64.txt" --no-deps
      - run: python -m pytest tests -q --basetemp "${{ runner.temp }}/document-reader-tests"
      - name: Python syntax check
        run: >-
          python -m compileall -q
          __init__.py cli.py dashboard engine engine_config.py install lifecycle.py mcp
          profile_runtime.py service tests viewer
      - name: Parse the Windows installer without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem -LiteralPath install -Filter '*.ps1' -File
            Get-Item -LiteralPath service/install-autostart.ps1
          )
          foreach ($script in $scripts) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $script.FullName -Raw))
          }

  package:
    name: Build and smoke-test release archives
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            install/locks/windows-cpython-311-x86_64.txt
            install/locks/windows-cpython-314-x86_64.txt
            scripts/lock-inputs/service-bootstrap.txt
      - run: npm ci --ignore-scripts
      - name: Install and verify the hashed Python 3.11 Windows service runtime
        shell: pwsh
        run: |
          $serviceRoot = Join-Path $env:RUNNER_TEMP "document-reader-service-311"
          $servicePython = Join-Path $serviceRoot "Scripts/python.exe"
          $report = Join-Path $env:RUNNER_TEMP "document-reader-service-311-pip-report.json"
          node scripts/validate-service-locks.mjs
          python -m venv $serviceRoot
          & $servicePython -I -m pip install --disable-pip-version-check --upgrade --force-reinstall --require-hashes --only-binary=:all: --report $report --requirement install/locks/windows-cpython-311-x86_64.txt
          if ($LASTEXITCODE -ne 0) { throw "Hashed service-lock install failed" }
          & $servicePython -I scripts/verify_service_lock_install.py --lock install/locks/windows-cpython-311-x86_64.txt --report $report --python-minor 3.11
          if ($LASTEXITCODE -ne 0) { throw "Service lock report/inventory verification failed" }
          & $servicePython -I -m pip check
          & $servicePython -I -c "import bs4, chandra, filetype, httpx, openai, openpyxl, pypdfium2"
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
      - run: python -m pip_audit --requirement install/locks/windows-cpython-311-x86_64.txt --no-deps
      - run: npm run validate
      - run: python -m pytest tests -q --basetemp "${{ runner.temp }}/document-reader-tests"
      - name: Audit the fully resolved Windows package environment
        run: python -m pip_audit --local
      - name: Verify release metadata
        id: metadata
        shell: pwsh
        run: |
          $version = (& node scripts/verify-release-metadata.mjs).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release metadata validation failed" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and verify exact archives
        shell: pwsh
        run: |
          node scripts/build-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact build failed" }
          node scripts/smoke-release-artifacts.mjs --version "${{ steps.metadata.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "Release artifact smoke test failed" }
      - name: Validate the extracted whole-product archive
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $archive = Join-Path $PWD "dist/hermes-document-reader-source-v$version.zip"
          $smoke = Join-Path $env:RUNNER_TEMP "document-reader-product-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $smoke
          Push-Location (Join-Path $smoke "hermes-document-reader-source-v$version")
          try {
            if (Test-Path -LiteralPath .git) { throw "Release archive unexpectedly contains Git metadata" }
            npm ci --ignore-scripts
            npm run validate
            python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
            python -m pytest tests -q --basetemp "$env:RUNNER_TEMP/document-reader-source-tests"
            python -m compileall -q __init__.py cli.py dashboard engine engine_config.py install lifecycle.py mcp profile_runtime.py service tests viewer
          } finally {
            Pop-Location
          }
      - name: Validate the root-layout plugin archive
        shell: pwsh
        run: |
          $version = "${{ steps.metadata.outputs.version }}"
          $archive = Join-Path $PWD "dist/hermes-document-reader-v$version.zip"
          $smoke = Join-Path $env:RUNNER_TEMP "document-reader-plugin-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $smoke
          if (-not (Test-Path -LiteralPath (Join-Path $smoke "plugin.yaml"))) { throw "Plugin archive is not root-layout" }
          if (-not (Test-Path -LiteralPath (Join-Path $smoke "__init__.py"))) { throw "Plugin archive lacks its Python entry point" }
          node --check (Join-Path $smoke "dashboard/dist/index.js")
          node --check (Join-Path $smoke "desktop-plugin/document-reader/plugin.js")
          python scripts/smoke_plugin_archive.py $archive --version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-document-reader-v${{ steps.metadata.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every pull-request commit is signed off
        run: >-
          python scripts/check_dco.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          --actor "${{ github.actor }}"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            install/locks/windows-cpython-311-x86_64.txt
            install/locks/windows-cpython-314-x86_64.txt
            scripts/lock-inputs/service-bootstrap.txt
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/validate-service-locks.mjs
      - run: python -m pip install --disable-pip-version-check --upgrade pip==26.2.1
      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt --requirement requirements-dev.txt
      - run: python -m pip_audit --requirement install/locks/windows-cpython-311-x86_64.txt --no-deps
      - run: python -m pip_audit --requirement install/locks/windows-cpython-314-x86_64.txt --no-deps
      - run: python -m pip_audit --requirement requirements.txt
      - run: python -m pip_audit --requirement requirements-dev.txt
      - name: Audit the fully resolved runtime and development environment
        run: python -m pip_audit --local

  required:
    # Push and manual runs must never emit the protected pull-request context.
    name: "${{ github.event_name == 'pull_request' && 'Required PR checks' || 'CI summary' }}"
    if: always()
    needs: [node, python, package, dco, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI lane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          NODE_RESULT: ${{ needs.node.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          DCO_RESULT: ${{ needs.dco.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          python - <<'PY'
          import os

          results = {
              "node": os.environ["NODE_RESULT"],
              "python": os.environ["PYTHON_RESULT"],
              "package": os.environ["PACKAGE_RESULT"],
              "dco": os.environ["DCO_RESULT"],
              "audit": os.environ["AUDIT_RESULT"],
          }
          failed = {
              name: results[name]
              for name in ("node", "python", "package", "audit")
              if results[name] != "success"
          }
          expected_dco = "success" if os.environ["EVENT_NAME"] == "pull_request" else "skipped"
          if results["dco"] != expected_dco:
              failed["dco"] = results["dco"]
          if failed:
              summary = ", ".join(f"{name}={result}" for name, result in sorted(failed.items()))
              raise SystemExit(f"Required CI lanes failed: {summary}")
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          PY
