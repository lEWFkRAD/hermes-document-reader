name: Feature request
description: Propose a focused improvement to the service, plugin, viewer, or MCP tools.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without private deployment details.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Privacy, profile, and security impact
      description: Explain new data, permissions, network listeners, or profile interactions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
